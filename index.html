    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('vite-ui-theme');
          var isDark = saved === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#12221E';
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#F5F1E8';
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
      // Global fallback for resolveAvatarUrl to protect against any cached PWA service worker chunks
      window.resolveAvatarUrl = function(profile, user) {
        try {
          var isMaher = 
            (user && user.email && (user.email.toLowerCase() === "maherbhatt01@gmail.com" || user.email.toLowerCase() === "maher@gmail.com")) ||
            (profile && profile.email && (profile.email.toLowerCase() === "maherbhatt01@gmail.com" || profile.email.toLowerCase() === "maher@gmail.com")) ||
            (profile && profile.display_name && profile.display_name.toLowerCase().indexOf("maher") !== -1);
          if (isMaher) {
            if (profile && profile.avatar_url && profile.avatar_url.indexOf("grad-") !== 0 && profile.avatar_url.indexOf("unsplash") === -1) {
              return profile.avatar_url;
            }
            return "https://woclidkjrzlquncudfuj.supabase.co/storage/v1/object/public/avatars/7b21ccf3-85a1-4471-9f0e-64fc850df5d1/avatar-1791466601274.jpg";
          }
          if (profile && profile.avatar_url && profile.avatar_url.indexOf("photo-1535713875002-d1d0cf377fde") === -1) return profile.avatar_url;
          if (user && user.user_metadata && user.user_metadata.avatar_url && user.user_metadata.avatar_url.indexOf("photo-1535713875002-d1d0cf377fde") === -1) return user.user_metadata.avatar_url;
          if (user && user.user_metadata && user.user_metadata.picture) return user.user_metadata.picture;
        } catch (e) {}
        return null;
      };
      // Global fallback for results to protect against cached PWA service worker chunks
      try {
        window.results = { totalCount: 0, tools: [], subjects: [], materials: [], topics: [], inContent: [] };
      } catch (e) {}
      // Automatic cache recovery for stale Service Worker / cached bundles
      window.addEventListener('error', function(event) {
        try {
          if (event && event.message && (
            event.message.indexOf("reading 'map'") !== -1 ||
            event.message.indexOf("Cannot access") !== -1 ||
            event.message.indexOf("Loading chunk") !== -1 ||
            event.message.indexOf("Failed to fetch dynamically imported module") !== -1
          )) {
            var key = 'itm_auto_cache_reloaded_' + (event.filename || 'bundle');
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, '1');
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  for (var i = 0; i < regs.length; i++) regs[i].unregister();
                });
              }
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  for (var j = 0; j < keys.length; j++) caches.delete(keys[j]);
                });
              }
              setTimeout(function() { window.location.reload(); }, 120);
            }
          }
        } catch (err) {}
      });
    </script>
